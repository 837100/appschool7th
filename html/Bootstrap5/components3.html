<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>컴포넌트 3</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
</head>

<body>
    <!-- Pagination-->
    <nav aria-label="Page navigation example">
        <ul class="pagination">
            <il class="page-item"><a class="page-link" href=#>이전</a></il>
            <il class="page-item"><a class="page-link" href=#>1</a></il>
            <il class="page-item"><a class="page-link" href=#>2</a></il>
            <il class="page-item"><span class="page-link" href=#>...</span></il>
            <il class="page-item"><a class="page-link" href=#>3</a></il>
            <il class="page-item"><a class="page-link" href=#>다음</a></il>
        </ul>
    </nav>

    <!-- Breadcrumb-->
    <nav aria-label="Breadcrumb">
        <ol class="Breadcrumb">
            <li class="breadcrumb-item"><a href="#">Home</a></li>
            <li class="breadcrumb-item"><a href="#">Library</a></li>
            <li class="breadcrumb-item active" aria-current="page">Data</li>

        </ol>
    </nav>

    <!-- Progress-->
    <div class="Progress">
        <div class="progress-bar" role="progressbar" style="width: 80%" aria-valuenow="80" aria-valuemin="0"
            aria-valuemax="100">80%</div>
    </div>
    <br />
    <br />

    <!-- Spinners -->
    <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
    <br />

    <!-- Carousel-->
    <div id="carouselExample" class="carousel slide">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="https://picsum.photos/1000/400" class="d-block w-100" alt="..." />
            </div>
            <div class="carousel-item">
                <img src="https://picsum.photos/1000/400" class="d-block w-100" alt="..." />
            </div>
            <div class="carousel-item">
                <img src="https://picsum.photos/1000/400" class="d-block w-100" alt="..." />
            </div>
        </div>
        <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="visually-hidden">이전</span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#carouselExample" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="visually-hidden">다음</span>
        </button>

    </div>
    </div>

    <div class="container">
        <h2>checkbox</h2>
        <div class="form-check">
            <input class="form-check" value="" id="defaultCheck1" />
            <label class="form-check-label" for="defaultCheck1">
                Default checkbox
            </label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="defaultCheck2" />
            <label class="form-check-label" for="defaultCheck2">
                Default checkbox2
            </label>
        </div>
        <div class="form-check">
            <input class="form-check-input" type="checkbox" value="" id="defaultCheck2" disabled />
            <label class="form-check-label" for="defaultCheck2">
                Disabled checkbox2
            </label>
        </div>

        <h2>radio</h2>
        <div class="form-check"></div>

        <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault1" />

        <label class="form-check-label" for="flexRadioDefault1">
            Default radio
        </label>

        <div class="form-check"></div>

        <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault3" checked />

        <label class="form-check-label" for="flexRadioDefault3">
            Default checked radio
        </label>

        <input class="form-check-input" type="radio" name="flexRadioDefault" id="flexRadioDefault2" disabled />

        <label class="form-check-label" for="flexRadioDefault2">
            Default checked radio
        </label>
    </div>

    <!-- popper -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const carousel = document.getElementById("carouselExample");
        const carouselInstance = new bootstrap.Carousel(carousel);
    </script>

</body>

</html>
