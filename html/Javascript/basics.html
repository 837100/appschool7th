<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>자바스크립트 기초</title>
</head>

<body>
    <h1>자바스크립트 기초 실습 예제</h1>
    <p>이 문서를 브라우저에서 열고, Cmd + Option + I 또는 F12 를 눌러 Consonle을 확인하세요.</p>
    <script>
        console.log("Javascript 실습 예제");
        // 1. 데이터 타입
        let num = 10;
        const number = 10;
        num = 11;
        //   number = 12;

        let str = "Hello Javascript!";
        let str1 = "hello, world!";

        let isActive = true;
        let emptyValue = null;
        let undefinedValue;

        console.log(emptyValue, undefinedValue);
        console.log(emptyValue == undefinedValue); // 값이 없다는 의미에서 같아서 true
        console.log(emptyValue === undefinedValue); //타임이 달라서 false

        console.log("typeof num:", typeof num);
        console.log("typeof str:", typeof str);
        console.log("typeof isActive:", typeof isActive);
        console.log("typeof emptyValue:", typeof emptyValue);
        console.log("typeof undefinedValue:", typeof undefinedValue);

        // 2. 연산자

        console.log("----------------------");
        console.log("연산자");
        console.log("----------------------");
        let a = 5;
        let b = 2;
        console.log("a + b = ", a + b);
        console.log("a - b = ", a - b);
        console.log("a * b = ", a * b);
        console.log("a / b = ", a / b);
        console.log("a % b = ", a % b);

        let greetingString = "Hello" + "World!";
        console.log("문자열 연결", greetingString); // 문자 이어 붙이기 : 문자 이어 붙이기 => Hello World!

        let n = 1;
        let str_n = "1";
        console.log(n + str_n);
        console.log(str_n + n);

        // 비교 연산
        console.log("a == 5:", a == 5); //ture
        console.log("a === 5 :", a === 5); //  (타입까지 비교)
        console.log("a !== b:", a !== b); // true
        console.log(" != b :", a != b);

        // 논리 연산
        console.log("(a > 2) && (b < 5) : ", a > 2 && b < 5); // true
        console.log("(a > 6) || (b === 2):", a > 6 || b === 2); //true
        console.log("!(a === 5):", !(a === 5)); // flase

        console.log(" Hello, World!                   ".trim());
        console.log(" Hello, World!                   ");

        // 3. 조건문
        console.log("----------------------");
        console.log("조건문");
        console.log("----------------------");

        let score = 91;
        if (score >= 90) {
            console.log("학점: A");
        } else if (score >= 80) {
            console.log("학점 : B");
        } else {
            console.log("학점: C");
        }

        switch (parseInt(score / 10)) {
            case 9:
                console.log("학점: A");
                break;
            case 8:
                console.log("학점: B");
                break;
            default:
                console.log("학점: C");
        }

        // 3항 연산자의 중첩: 보기 좋지 않음.
        let result = (score >= 90) ? "학점: A" : "학점: B";
        console.log(result);

        console.log("3항 연산자의 중첩");
        let result2 = (score >= 90) ? "학점: A" : (score >= 80) ? "학점: B" : "학점: C";
        console.log(result2);


        // 4. 반복문
        console.log("----------------------");
        console.log("반복문");
        console.log("----------------------");

        for (let i = 0; i < 5; i++) {
            console.log(i);

        }

        let i = 0;
        while (i < 5) {
            console.log(i);
            i++;
        }


        // 일단 실행하는 식 do while 최초 1회 실행 보장
        do {
            console.log(i);
            i++;
        } while (i < 5);


        // 중첩 반복문은 좋지 않음.
        for (let i = 0; i < 3; i++) {
            for (let j = 0; j < 3; j++) {
                console.log(i, j);
            }
        }

        // 5. 함수
        console.log("----------------------");
        console.log("함수");
        console.log("----------------------");

        // 5-1. 함수 선언문
        function sayHello(name) {
            console.log("안녕하세요, " + name + "님!");

        };

        // //5-2 반환값이 있는 함수
        // function add(a, b) {
        //     return a + b;
        // }
        // 호출 함수 
        sayHello("홍길동");

        // 5-3. 함수 표현식 (Function Expression)
        const add = function (a, b) {
            return a + b;
        };
        console.log("add(2,3) =", add(2, 3));

        // 5-4. 화살표 함수 (Arrow Function)
        const multiply = (a, b) => {
            return a * b;
        };
        console.log("multiply(4,5) =", multiply(4, 5));

        //  function multiply(a * b){
        //     return a * b;
        // };
        // 와 거의 동일

        //(1) 콜백으로 사용할 함수
        function greeting(name) {
            alert("안녕, " + name + "님!");
        }

        // (2) 함수를 인자로 받아서 내부에서 호출하는 함수
        function processUserInput(callback) {
            const userName = prompt("이름을 입력하세요: ", "홍길동");
            if (userName !== null)
                callback(userName);
        }
        processUserInput(greeting);

    </script>
</body>

</html>
